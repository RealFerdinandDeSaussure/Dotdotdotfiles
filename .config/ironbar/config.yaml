name: "main_bar"
position: "top"
height: 0
popup_gap: 12
popup_autohide: true
start:
  - type: "custom"
    name: "start-bar"
    bar:
    - type: "custom"
      name: "power"
      bar:
      - type: "button"
        label: ""
        on_click: "popup:toggle"
      popup:
      - type: "box"
        orientation: "horizontal"
        widgets:
        - type: "button"
          class: "power-button image-button"
          on_click: "!systemctl reboot"
          widgets:
          - type: "image"
            src: "icon:system-reboot-symbolic"
            size: 42
        - type: "button"
          class: "power-button image-button"
          on_click: "!systemctl poweroff"
          widgets:
          - type: "image"
            src: "icon:system-shutdown-symbolic"
            size: 42
    - type: "bindmode"
    - type: "workspaces"
      all_monitors: true
      sort: "index"
  - type: "focused"
    name: "focused"
    icon_size: 18
    truncate:
      mode: "middle"
      max_length: 40
    show_title: true
end:
  - type: "custom"
    name: "clipboard"
    bar:
    - type: "button"
      on_click: "!$HOME/.config/ironbar/scripts/wl-clipboard widget main_bar clipboard"
      widgets:
      - type: "label"
        label: " "
      - type: "label"
        name: "clipboard-content"
        label: "{{watch:$HOME/.config/ironbar/scripts/wl-clipboard}}"
    popup:
    - type: "box"
      orientation: "vertical"
      class: "clipboard-popup"
      widgets:
      - type: "button"
        class: "text-button"
        show_if: "#clip2"
        label: "#clip2"
        on_click: "!$HOME/.config/ironbar/scripts/wl-clipboard varcopy 2"
      - type: "button"
        class: "text-button"
        show_if: "#clip3"
        label: "#clip3"
        on_click: "!$HOME/.config/ironbar/scripts/wl-clipboard varcopy 3"
      - type: "button"
        class: "text-button"
        show_if: "#clip4"
        label: "#clip4"
        on_click: "!$HOME/.config/ironbar/scripts/wl-clipboard varcopy 4"
      - type: "button"
        class: "text-button"
        show_if: "#clip5"
        label: "#clip5"
        on_click: "!$HOME/.config/ironbar/scripts/wl-clipboard varcopy 5"
      - type: "button"
        class: "text-button"
        show_if: "#clip6"
        label: "#clip6"
        on_click: "!$HOME/.config/ironbar/scripts/wl-clipboard varcopy 6"
  - type: "music"
    player_type: "mpd"
    music_dir: "$HOME/Musik/"
    marquee:
      enable: true
      max_length: 40
      pause_duration: 10000
  - type: "script"
    cmd: "$HOME/.config/ironbar/scripts/network"
    mode: "poll"
    interval: 10000
  - type: "bluetooth"
    disable_popup: true
    show_if: "systemctl is-active --quiet bluetooth.service"
    format:
      disabled: ""
      enabled: ""
      connected: ""
      connected_battery: " {device_battery_percent}%"
  - type: "inhibit"
    durations: ["00:30:00", "01:00:00", "inf"]
    format_on: ' {duration}'
    format_off: ''
  - type: "battery"
    show_if: "upower -b"
    icon_size: 18
    format: ""
  - type: "clock"
    name: "clock"
    format: "%H:%M"
  - type: "tray"
